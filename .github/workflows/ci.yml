name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  JWT_SECRET_KEY: ci-test-secret-key-not-for-production
  ENABLE_PUBLIC_IP_LOOKUP: "0"
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: admin123-ci
  DATABASE_URL: sqlite:////tmp/panel-ci.db

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check app/ || true

      - name: Byte-compile check (catch syntax errors)
        run: python -m py_compile app/*.py scripts/*.py

      - name: Start API server
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "Server is up"
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 1
          done

      - name: Run API differential tests
        env:
          PANEL_URL: http://127.0.0.1:8000
        run: |
          chmod +x scripts/test_api.sh
          ./scripts/test_api.sh

      - name: Dump server logs on failure
        if: failure()
        run: cat server.log || true

      - name: Stop API server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: proxy-panel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        run: |
          docker run -d --name panel-smoke -p 8000:8000 \
            -e JWT_SECRET_KEY="${JWT_SECRET_KEY}" \
            -e ADMIN_USERNAME="${ADMIN_USERNAME}" \
            -e ADMIN_PASSWORD="${ADMIN_PASSWORD}" \
            -e ENABLE_PUBLIC_IP_LOOKUP="${ENABLE_PUBLIC_IP_LOOKUP}" \
            proxy-panel:ci
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "Container is healthy"
              break
            fi
            echo "Waiting for container... ($i)"
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health

      - name: Dump container logs on failure
        if: failure()
        run: docker logs panel-smoke || true

      - name: Stop container
        if: always()
        run: docker rm -f panel-smoke || true
