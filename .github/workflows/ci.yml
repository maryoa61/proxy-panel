name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JWT_SECRET_KEY: ci-test-secret-key-not-for-production
  ENABLE_PUBLIC_IP_LOOKUP: "0"
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: admin123-ci
  DATABASE_URL: sqlite:////tmp/panel-ci.db

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python byte-compile check
        run: |
          python -m compileall -q -f app scripts
          echo "Python byte-compile check passed."

      - name: Bash syntax checks
        run: |
          for script in $(git ls-files '*.sh'); do
            echo "Checking shell syntax: ${script}"
            bash -n "${script}"
          done
          echo "Bash syntax checks passed."

      - name: Start API server
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          echo $! > server.pid
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "API server is up"
              exit 0
            fi
            sleep 1
          done
          echo "API server did not become healthy" >&2
          cat server.log || true
          exit 1

      - name: Run API test suite
        env:
          PANEL_URL: http://127.0.0.1:8000
        run: |
          chmod +x scripts/test_api.sh
          ./scripts/test_api.sh

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-python-${{ matrix.python-version }}
          path: |
            server.log
            server.pid
          if-no-files-found: warn

      - name: Stop API server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: proxy-panel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        run: |
          docker run -d --name panel-smoke -p 8000:8000 \
            -e JWT_SECRET_KEY="${JWT_SECRET_KEY}" \
            -e ADMIN_USERNAME="${ADMIN_USERNAME}" \
            -e ADMIN_PASSWORD="${ADMIN_PASSWORD}" \
            -e ENABLE_PUBLIC_IP_LOOKUP="${ENABLE_PUBLIC_IP_LOOKUP}" \
            proxy-panel:ci
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "Container is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy" >&2
          docker logs panel-smoke > panel-smoke.log 2>&1 || true
          cat panel-smoke.log || true
          exit 1

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: panel-smoke.log
          if-no-files-found: warn

      - name: Stop container
        if: always()
        run: docker rm -f panel-smoke || true
